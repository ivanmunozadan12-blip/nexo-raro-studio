name: Behind del Mundo · prueba cinematográfica de Colón

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/3d-smoke-test.yml"
      - "scripts/scene-engine.js"
      - "scripts/columbus-preview.mjs"
      - "scripts/columbus-test-script.json"

concurrency:
  group: columbus-3d-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  columbus-3d-preview:
    name: Render de las siete escenas históricas
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Validar sintaxis del motor y del render de prueba
        run: |
          node --check scripts/scene-engine.js
          node --check scripts/columbus-preview.mjs
          node --check scripts/produce.mjs
      - name: Renderizar vídeo visual de Colón con el mismo motor de producción
        run: node scripts/columbus-preview.mjs
      - name: Guardar MP4 de prueba
        uses: actions/upload-artifact@v4
        with:
          name: columbus-cinematic-3d-preview
          path: .artifacts/columbus-visual-test/columbus-3d-preview.mp4
          if-no-files-found: error
          retention-days: 7
