name: Behind del Mundo · pruebas del motor 3D procedural

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/3d-smoke-test.yml"
      - "scripts/scene-engine.js"
      - "scripts/procedural-engine.js"
      - "scripts/procedural-engine.test.mjs"
      - "scripts/procedural-preview.mjs"
      - "scripts/procedural-preview-script.json"

concurrency:
  group: columbus-3d-preview
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  columbus-3d-preview:
    name: Tests de modelos y renders visuales
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependencias
        run: npm install
      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
      - name: Instalar Chromium headless compatible con WebGL
        shell: bash
        run: |
          npx --yes puppeteer browsers install chrome-headless-shell
          CHROME_BIN=$(find "$HOME/.cache" -type f -name 'chrome-headless-shell' -perm -u+x 2>/dev/null | head -n 1)
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::Puppeteer no ha instalado chrome-headless-shell"
            find "$HOME/.cache" -type f -iname '*chrome*' | head -n 60
            exit 1
          fi
          echo "Chrome headless encontrado: $CHROME_BIN"
          cat > "$RUNNER_TEMP/chrome-webgl" <<EOF
          #!/usr/bin/env bash
          exec "$CHROME_BIN" --enable-webgl --ignore-gpu-blocklist --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/chrome-webgl"
          echo "HYPERFRAMES_BROWSER_PATH=$RUNNER_TEMP/chrome-webgl" >> "$GITHUB_ENV"
          echo "PRODUCER_HEADLESS_SHELL_PATH=$RUNNER_TEMP/chrome-webgl" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$RUNNER_TEMP/chrome-webgl" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/chrome-webgl" --version
      - name: Validar sintaxis del motor y del render de prueba
        run: |
          node --check scripts/scene-engine.js
          node --check scripts/procedural-engine.js
          node --check scripts/procedural-preview.mjs
          node --check scripts/produce.mjs
          node --test scripts/procedural-engine.test.mjs
      - name: Renderizar escenas variadas con modelos procedurales
        run: node scripts/procedural-preview.mjs
      - name: Guardar vista previa procedural
        uses: actions/upload-artifact@v4
        with:
          name: behind-del-mundo-procedural-3d-previews
          path: |
            .artifacts/procedural-3d-preview/procedural-3d-preview.mp4
          if-no-files-found: error
          retention-days: 7
