name: BDM cinematic proof · Remotion

on:
  workflow_dispatch:
  push:
    branches: [cinematic-proof-v1]
    paths:
      - "cinematic-proof/**"
      - ".github/workflows/cinematic-proof.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cinematic-proof-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cinematic-proof/package.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n 1
      - name: Install Remotion dependencies
        working-directory: cinematic-proof
        run: npm install --no-audit --no-fund
      - name: Download licensed visual assets
        working-directory: cinematic-proof
        run: |
          python -m pip install --disable-pip-version-check requests
          python fetch_assets.py
          python - <<'PY'
          import json, pathlib
          rows=json.loads(pathlib.Path("public/credits.json").read_text())
          assert len(list(pathlib.Path("public/assets").glob("*"))) >= 6
          assert len(rows) >= 6, f"Expected 6 image credits, got {len(rows)}"
          print("Asset licence records verified:", len(rows))
          PY
      - name: Install Chromium for Remotion
        working-directory: cinematic-proof
        run: npx remotion browser ensure
      - name: Render cinematic sequence
        working-directory: cinematic-proof
        run: |
          mkdir -p out
          npx remotion render src/index.ts Antikythera out/visual-only.mp4 --codec=h264 --crf=18 --concurrency=2
      - name: Generate Spanish narration and original ambience
        working-directory: cinematic-proof
        run: |
          python -m pip install --disable-pip-version-check edge-tts
          edge-tts --voice es-ES-AlvaroNeural --rate="+4%" --pitch="-2Hz" --text "En mil novecientos uno, unos buceadores hallaron un pecio frente a Anticitera. Entre sus restos apareció una máquina de bronce. Sus engranajes podían seguir los ciclos del cielo y anticipar eclipses. Dos mil años después, sigue asombrando a quienes intentan reconstruirla." --write-media out/narration.mp3
          ffmpeg -y -f lavfi -i "anoisesrc=color=pink:sample_rate=48000:amplitude=0.018:duration=18" -f lavfi -i "sine=frequency=54:sample_rate=48000:duration=18" -filter_complex "[0:a]lowpass=f=420,volume=0.42[a0];[1:a]lowpass=f=90,volume=0.12[a1];[a0][a1]amix=inputs=2:duration=longest,afade=t=in:st=0:d=2,afade=t=out:st=15:d=3,volume=0.6[amb]" -map "[amb]" -c:a libmp3lame -q:a 5 out/ambience.mp3
          ffmpeg -y -i out/visual-only.mp4 -i out/narration.mp3 -i out/ambience.mp3 -filter_complex "[1:a]adelay=450|450,volume=1.0[voice];[2:a]volume=0.34[bed];[voice][bed]amix=inputs=2:duration=longest:dropout_transition=2,alimiter=limit=0.95[a]" -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest out/behind-del-mundo-cinematic-proof.mp4
      - name: Verify video, audio and frame quality
        working-directory: cinematic-proof
        run: |
          set -euo pipefail
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration -of json out/behind-del-mundo-cinematic-proof.mp4 | tee out/probe.json
          python - <<'PY'
          import json, subprocess, pathlib
          d=json.load(open("out/probe.json")); v=next(s for s in d["streams"] if s["codec_type"]=="video"); a=next(s for s in d["streams"] if s["codec_type"]=="audio")
          duration=float(d["format"]["duration"])
          assert (v["width"],v["height"])==(1080,1920), v
          assert v["codec_name"]=="h264" and v["r_frame_rate"]=="30/1", v
          assert int(v.get("nb_frames",0))>=530, v
          assert a["codec_name"]=="aac", a
          assert 17.5<=duration<=20.5, duration
          print("Validated:",v["width"],"x",v["height"],v["r_frame_rate"],v["nb_frames"],"frames;",duration,"seconds; audio",a["codec_name"])
          subprocess.run(["ffmpeg","-y","-v","error","-i","out/behind-del-mundo-cinematic-proof.mp4","-vf","fps=1/3,scale=270:480,tile=3x2","-frames:v","1","out/contact-sheet.jpg"],check=True)
          PY
          test -s out/contact-sheet.jpg
      - name: Upload finished video and visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: bdm-cinematic-proof-18s
          path: |
            cinematic-proof/out/behind-del-mundo-cinematic-proof.mp4
            cinematic-proof/out/contact-sheet.jpg
            cinematic-proof/public/credits.json
          retention-days: 14
