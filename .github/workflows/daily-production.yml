name: Behind del Mundo · producción diaria

on:
  # Programación automática pausada temporalmente.
  # Se conserva workflow_dispatch para pruebas manuales autorizadas.
  workflow_dispatch:
    inputs:
      slot:
        description: "Horario a producir"
        required: true
        type: choice
        options: ["07:30", "14:30", "20:30"]
      production_date:
        description: "Fecha local Europe/Madrid (vacío = hoy; horarios pasados hoy se bloquean)"
        required: false
        type: string
        default: ""
      reset_production:
        description: "Borrar datos de producción anteriores antes de generar"
        required: false
        type: boolean
        default: false
      script_id:
        description: "ID de guion importado (omite Groq)"
        required: false
        type: string
        default: ""
      queue_index:
        description: "Orden dentro del lote importado"
        required: false
        type: string
        default: "0"

concurrency:
  group: behind-del-mundo-${{ inputs.script_id || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: Europe/Madrid
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar FFmpeg y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install
          python -m pip install --upgrade pip edge-tts
      - name: Comprobar configuración
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Falta SUPABASE_URL en GitHub Actions secrets" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "::error::Falta SUPABASE_SERVICE_ROLE_KEY en GitHub Actions secrets" && exit 1)
      - name: Generar y renderizar vídeo
        env:
          MANUAL_SLOT: ${{ inputs.slot || '' }}
          MANUAL_DATE: ${{ inputs.production_date || '' }}
          RESET_PRODUCTION: ${{ inputs.reset_production || false }}
          MANUAL_SCRIPT_ID: ${{ inputs.script_id || '' }}
          MANUAL_QUEUE_INDEX: ${{ inputs.queue_index || '0' }}
        run: npm run produce
      - name: Guardar MP4 como artefacto de respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behind-del-mundo-render-${{ github.run_id }}
          path: renders/*.mp4
          if-no-files-found: ignore
          retention-days: 14
