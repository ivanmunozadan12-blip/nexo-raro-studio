name: Nexo Raro · producción diaria

on:
  schedule:
    - cron: "30 7 * * *"
      timezone: "Europe/Madrid"
    - cron: "30 14 * * *"
      timezone: "Europe/Madrid"
    - cron: "30 20 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      slot:
        description: "Horario a producir"
        required: true
        type: choice
        options: ["07:30", "14:30", "20:30"]

concurrency:
  group: nexo-raro-daily-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: Europe/Madrid
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar FFmpeg y dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          npm install
          python -m pip install --upgrade pip edge-tts
      - name: Comprobar configuración
        run: |
          test -n "$GEMINI_API_KEY" || (echo "::error::Falta GEMINI_API_KEY en GitHub Actions secrets" && exit 1)
          test -n "$SUPABASE_URL" || (echo "::error::Falta SUPABASE_URL en GitHub Actions secrets" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "::error::Falta SUPABASE_SERVICE_ROLE_KEY en GitHub Actions secrets" && exit 1)
      - name: Generar y renderizar vídeo
        env:
          MANUAL_SLOT: ${{ inputs.slot || '' }}
        run: npm run produce
      - name: Guardar MP4 como artefacto de respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-raro-render-${{ github.run_id }}
          path: renders/*.mp4
          if-no-files-found: ignore
          retention-days: 14
