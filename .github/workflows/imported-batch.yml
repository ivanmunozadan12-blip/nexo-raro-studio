name: Behind del Mundo · lote de guiones importados

on:
  push:
    paths:
      - ".github/dispatch/three-scripts.json"

permissions:
  contents: read

jobs:
  prepare:
    name: Preparar lote de guiones
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Construir matriz desde el lote solicitado
        id: set-matrix
        run: |
          MATRIX=$(jq -c '[.script_ids | to_entries[] | {script_id: .value, queue_index: (.key | tostring), slot: (["07:30","14:30","20:30"][.key])}]' .github/dispatch/three-scripts.json)
          test "$(echo "$MATRIX" | jq 'length')" -gt 0
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Guiones del lote: $(echo "$MATRIX" | jq 'length')"

  produce:
    name: Render guion ${{ matrix.queue_index }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: behind-del-mundo-imported-${{ matrix.script_id }}
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: Europe/Madrid
      MANUAL_SLOT: ${{ matrix.slot }}
      MANUAL_SCRIPT_ID: ${{ matrix.script_id }}
      MANUAL_QUEUE_INDEX: ${{ matrix.queue_index }}
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar FFmpeg y dependencias
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          python -m pip install --upgrade pip edge-tts
      - name: Comprobar configuración
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Falta SUPABASE_URL en GitHub Actions secrets" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "::error::Falta SUPABASE_SERVICE_ROLE_KEY en GitHub Actions secrets" && exit 1)
      - name: Generar y renderizar vídeo
        run: npm run produce
      - name: Guardar MP4 como artefacto de respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behind-del-mundo-importado-${{ matrix.queue_index }}-${{ github.run_id }}
          path: renders/*.mp4
          if-no-files-found: ignore
          retention-days: 14
