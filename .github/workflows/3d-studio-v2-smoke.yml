name: BDM 3D Studio v2 · smoke render

on:
  workflow_dispatch:
  push:
    paths:
      - "render3d/**"
      - ".github/workflows/3d-studio-v2-smoke.yml"

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg xvfb libegl1 libegl-mesa0 libgl1-mesa-dri libxrender1 libxext6 libsm6
          blender --version | head -n 2
          ffmpeg -version | head -n 1
      - name: Validate project JSON
        run: python3 -m json.tool render3d/demo-project.json > /dev/null
      - name: Render fast pipeline smoke test
        run: |
          mkdir -p renders
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender --background --python-exit-code 1 --python render3d/blender_renderer.py -- render3d/demo-project.json renders/studio-v2-demo.mp4
          test -s renders/studio-v2-demo.mp4
      - name: Verify MP4 output and visual signal
        run: |
          set -euo pipefail
          test -s renders/studio-v2-demo.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=width,height,codec_name,r_frame_rate,avg_frame_rate,nb_frames -show_entries format=duration -of json renders/studio-v2-demo.mp4 | tee /tmp/bdm-video.json
          python3 - <<'PY'
          import json
          data=json.load(open("/tmp/bdm-video.json"))
          stream=data["streams"][0]
          duration=float(data["format"]["duration"])
          assert (stream["width"],stream["height"]) == (1080,1920), f"Wrong resolution: {stream['width']}x{stream['height']}"
          assert stream["codec_name"] == "h264", f"Unexpected codec: {stream['codec_name']}"
          assert stream["r_frame_rate"] == "30/1", f"Wrong frame rate: {stream['r_frame_rate']}"
          assert int(stream.get("nb_frames",0)) >= 210, f"Too few frames: {stream.get('nb_frames')}"
          assert duration >= 7.0, f"Unexpected duration: {duration}"
          print(f"Video validated: {stream['width']}x{stream['height']} at {stream['r_frame_rate']}, {stream['nb_frames']} frames, {duration:.2f}s")
          PY
          ffmpeg -v error -i renders/studio-v2-demo.mp4 -vf "signalstats,metadata=print:file=/tmp/bdm-frame-stats.txt" -an -f null -
          python3 - <<'PY'
          import re
          values=[float(x) for x in re.findall(r"lavfi.signalstats.YAVG=([0-9.]+)",open("/tmp/bdm-frame-stats.txt").read())]
          if len(values)<200: raise SystemExit(f"QA failed: expected at least 200 decoded frames, got {len(values)}")
          print("Frame average luma:",min(values),"to",max(values))
          if min(values)<8 or max(values)<24 or sum(values)/len(values)<35:
              raise SystemExit("QA failed: video is black, too dark, or mostly empty")
          PY
          mkdir -p renders/qa
          ffmpeg -y -v error -ss 1 -i renders/studio-v2-demo.mp4 -frames:v 1 renders/qa/frame-01.png
          ffmpeg -y -v error -ss 3.5 -i renders/studio-v2-demo.mp4 -frames:v 1 renders/qa/frame-02.png
          ffmpeg -y -v error -ss 6 -i renders/studio-v2-demo.mp4 -frames:v 1 renders/qa/frame-03.png
      - uses: actions/upload-artifact@v4
        with:
          name: bdm-3d-studio-v2-smoke
          path: renders/studio-v2-demo.mp4
          retention-days: 14
