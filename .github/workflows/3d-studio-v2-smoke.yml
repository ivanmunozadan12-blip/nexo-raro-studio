name: BDM 3D Studio v2 · smoke render

on:
  workflow_dispatch:
  push:
    paths:
      - "render3d/**"
      - ".github/workflows/3d-studio-v2-smoke.yml"

permissions:
  contents: read

concurrency:
  group: bdm-3d-studio-v2-smoke
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg xvfb libegl1 libegl-mesa0 libgl1-mesa-dri libxrender1 libxext6 libsm6
          blender --version | head -n 2
          ffmpeg -version | head -n 1
      - name: Validate project JSON
        run: python3 -m json.tool render3d/demo-project.json > /dev/null
      - name: Render fast pipeline smoke test
        run: |
          mkdir -p renders
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a blender --background --python-exit-code 1 --python render3d/blender_renderer.py -- render3d/demo-project.json renders/studio-v2-demo.mp4
          test -s renders/studio-v2-demo.mp4
      - name: Verify MP4 output
        run: |
          test -s renders/studio-v2-demo.mp4
          ffprobe -v error -show_entries stream=width,height,codec_name -show_entries format=duration -of json renders/studio-v2-demo.mp4
          ffmpeg -v error -i renders/studio-v2-demo.mp4 -vf "blackdetect=d=0.5:pix_th=0.98" -an -f null -
      - uses: actions/upload-artifact@v4
        with:
          name: bdm-3d-studio-v2-smoke
          path: renders/studio-v2-demo.mp4
          retention-days: 14
