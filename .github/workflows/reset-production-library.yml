name: Behind del Mundo · vaciado de biblioteca de producción

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/dispatch/reset-production-library.json"

permissions:
  contents: read

jobs:
  reset:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vaciar biblioteca de producción conservando configuración
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';

          const config = JSON.parse(await readFile('.github/dispatch/reset-production-library.json', 'utf8'));
          if (config.confirm !== 'DELETE_PRODUCTION_LIBRARY' || config.preserve_config !== true) {
            throw new Error('Falta la confirmación explícita de borrado o la protección de configuración.');
          }
          const base = process.env.SUPABASE_URL?.replace(/\\/$/, '');
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY;
          if (!base || !key) throw new Error('Faltan las credenciales de Supabase.');
          const headers = { apikey: key, Authorization: `Bearer ${key}` };

          async function api(path, options = {}) {
            const response = await fetch(base + path, { ...options, headers: { ...headers, ...(options.headers || {}) } });
            const body = await response.text();
            if (!response.ok) throw new Error(`Supabase ${response.status} en ${path}: ${body.slice(0, 1000)}`);
            return { response, body };
          }

          async function listFiles(bucket, prefix = '', depth = 0) {
            if (depth > 8) throw new Error('La estructura de carpetas supera la profundidad de seguridad.');
            const { body } = await api(`/storage/v1/object/list/${encodeURIComponent(bucket)}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ prefix, limit: 1000, offset: 0, sortBy: { column: 'name', order: 'asc' } })
            });
            const items = JSON.parse(body || '[]');
            const files = [];
            for (const item of items) {
              const name = prefix ? `${prefix}/${item.name}` : item.name;
              if (!item.id && !item.metadata) files.push(...await listFiles(bucket, name, depth + 1));
              else files.push(name);
            }
            return files;
          }

          const buckets = ['nexo-videos', 'channel-videos'];
          for (const bucket of buckets) {
            const files = await listFiles(bucket);
            for (let i = 0; i < files.length; i += 100) {
              const batch = files.slice(i, i + 100);
              await api(`/storage/v1/object/${encodeURIComponent(bucket)}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prefixes: batch })
              });
            }
            console.log(`Storage ${bucket}: eliminados ${files.length} archivos.`);
          }

          const tables = ['social_analytics', 'social_posts', 'videos', 'production_jobs', 'editorial_memory', 'scripts'];
          for (const table of tables) {
            const { body } = await api(`/rest/v1/${table}?id=not.is.null`, {
              method: 'DELETE',
              headers: { Prefer: 'return=representation', 'Content-Type': 'application/json' }
            });
            const rows = body ? JSON.parse(body) : [];
            console.log(`${table}: eliminados ${rows.length} registros.`);
          }

          for (const table of tables) {
            const { body } = await api(`/rest/v1/${table}?select=id&limit=1`);
            if (JSON.parse(body || '[]').length) throw new Error(`La tabla ${table} no quedó vacía.`);
          }
          console.log('Biblioteca vacía. Se conservan channel_settings, series, provider_usage, usuarios, credenciales, código y configuración de publicación.');
          NODE
