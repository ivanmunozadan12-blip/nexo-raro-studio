name: BEHIND DEL MUNDO · pruebas del nuevo motor

on:
  push:
    branches: [rebuild-python-explainer-engine]
    paths:
      - 'engine/**'
      - 'app/**'
      - 'package.json'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias del motor
        run: |
          python -m pip install -r engine/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Probar sintaxis y escenas
        run: |
          python -m py_compile engine/produce.py engine/render_video.py engine/audio_bed.py
          python -m unittest discover -s engine -p 'test_*.py'
      - name: Instalar dependencias web
        run: npm install
      - name: Typecheck y build web
        run: |
          npm run typecheck
          npm run build
