name: BEHIND DEL MUNDO · validación final del estudio

on:
  push:
    branches: [prompt-video-studio]
    paths:
      - 'app/**'
      - 'lib/social-oauth.ts'
      - 'engine/**'
      - 'package.json'
      - '.github/workflows/final-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: behind-final-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias Python
        run: python -m pip install -r engine/requirements.txt
      - name: Sintaxis Python y pruebas del motor
        run: |
          python -m py_compile engine/produce.py engine/render_video.py engine/audio_bed.py engine/srt_captions.py engine/publish.py
          python -m unittest discover -s engine -p 'test_*.py'
      - name: Renderizar muestra vertical completa
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m edge_tts --voice es-ES-AlvaroNeural --rate=+5% --text "$(python -c 'import json; print(json.load(open("engine/sample_script.json"))["narration"])')" --write-media /tmp/voice.mp3 --write-subtitles /tmp/voice.srt
          python engine/srt_captions.py --script engine/sample_script.json --srt /tmp/voice.srt
          python engine/audio_bed.py --duration 66 --output /tmp/music.wav --script engine/sample_script.json
          python engine/render_video.py --script engine/sample_script.json --voice /tmp/voice.mp3 --output /tmp/silent.mp4
          ffmpeg -y -v error -i /tmp/silent.mp4 -i /tmp/voice.mp3 -i /tmp/music.wav -filter_complex "[1:a]volume=1.0[v];[2:a]volume=0.22,afade=t=in:st=0:d=2,afade=t=out:st=60:d=3[m];[v][m]amix=inputs=2:duration=longest:dropout_transition=2[a]" -map 0:v:0 -map "[a]" -c:v copy -c:a aac -b:a 160k -shortest /tmp/behind-del-mundo-test.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height -of json /tmp/behind-del-mundo-test.mp4
      - name: Guardar MP4 de prueba
        uses: actions/upload-artifact@v4
        with:
          name: behind-del-mundo-final-video-test
          path: /tmp/behind-del-mundo-test.mp4
          if-no-files-found: error
          retention-days: 7
      - name: Instalar dependencias web
        run: npm install
      - name: Typecheck y build de producción
        run: |
          npm run typecheck
          npm run build
