name: Behind del Mundo · limpieza puntual de almacenamiento

on:
  push:
    paths:
      - "scripts/storage-cleanup-target.txt"

permissions:
  contents: read

jobs:
  remove-orphan-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Eliminar objeto huérfano de Supabase Storage
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/cleanup-orphan-video.mjs
