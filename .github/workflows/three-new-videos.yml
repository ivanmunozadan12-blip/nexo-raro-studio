name: Behind del Mundo · nueva producción de tres vídeos

on:
  push:
    paths:
      - ".github/dispatch/three-new-videos.json"

permissions:
  contents: read

jobs:
  prepare:
    name: Preparar tres producciones
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: prepare
        name: Leer archivos JSON
        run: |
          MATRIX=$(jq -c '[.files | to_entries[] | {queue_index: (.key | tostring), file: .value}]' .github/dispatch/three-new-videos.json)
          test "$(echo "$MATRIX" | jq 'length')" -eq 3
          echo "$MATRIX" | jq -e 'all(.[]; (.file | type == "string") and (.file | endswith(".json")))' >/dev/null
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Se producirán tres vídeos: $MATRIX"

  produce:
    name: Producir vídeo ${{ matrix.queue_index }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    concurrency:
      group: behind-del-mundo-new-batch-${{ github.run_id }}-${{ matrix.queue_index }}
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TZ: Europe/Madrid
      MANUAL_QUEUE_INDEX: ${{ matrix.queue_index }}
      MANUAL_SCRIPT_FILE: ${{ matrix.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar FFmpeg y dependencias
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -n 1
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          python -m pip install --upgrade pip edge-tts
      - name: Activar WebGL 3D por software en Chrome
        shell: bash
        run: |
          CHROME_BIN=$(find "$HOME/.cache" -type f -name 'chrome-headless-shell' -perm -u+x 2>/dev/null | head -n 1)
          if [ -z "$CHROME_BIN" ]; then
            echo "::error::No se encontró chrome-headless-shell de HyperFrames"
            find "$HOME/.cache" -maxdepth 6 -type f -iname '*chrome*' | head -n 30
            exit 1
          fi
          cat > "$RUNNER_TEMP/chrome-webgl" <<EOF
          #!/usr/bin/env bash
          exec "$CHROME_BIN" --enable-webgl --ignore-gpu-blocklist --use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader "\$@"
          EOF
          chmod +x "$RUNNER_TEMP/chrome-webgl"
          echo "HYPERFRAMES_BROWSER_PATH=$RUNNER_TEMP/chrome-webgl" >> "$GITHUB_ENV"
          echo "CHROME_PATH=$RUNNER_TEMP/chrome-webgl" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/chrome-webgl" --version
      - name: Comprobar credenciales
        run: |
          test -n "$SUPABASE_URL" || (echo "::error::Falta SUPABASE_URL" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "::error::Falta SUPABASE_SERVICE_ROLE_KEY" && exit 1)
      - name: Generar guion, renderizar y guardar MP4
        run: npm run produce
      - name: Guardar MP4 como respaldo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behind-del-mundo-three-video-${{ matrix.queue_index }}-${{ github.run_id }}
          path: renders/*.mp4
          if-no-files-found: ignore
          retention-days: 14
